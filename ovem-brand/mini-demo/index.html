<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F8FF">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230B1D3D'/%3E%3Cpath d='M32 14 46 22 46 40 32 48 18 40 18 22Z' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<title>OVEM 光谷效应 · 小程序网页演示</title>
<meta name="description" content="OVEM 光谷效应小程序网页演示版，可在手机浏览器中浏览全部 8 个页面。">
<style>
:root{
  --ink:#16243D; --ink-2:#3E4C64; --muted:#7C879A; --muted-2:#8A95A8;
  --blue:#1F4BD8; --navy:#0B1D3D; --paper:#F4F8FF; --line:#E4EBF4; --white:#fff;
  --sky:#2AA9D6; --green:#0E9F6E; --warn:#B76B09;
  --shadow:0 8px 26px rgba(22,36,61,.055);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;overflow:hidden;background:#06152D;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block}
.asset-preload{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;left:-9999px;top:0}
.asset-preload img{width:1px;height:1px}

/* ---------- desktop stage ---------- */
.stage{
  height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:13px;padding:22px;position:relative;isolation:isolate;
}
.stage::before{
  content:"";position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 18% 12%, rgba(31,75,216,.24), transparent 34%),
    radial-gradient(circle at 82% 88%, rgba(42,169,214,.14), transparent 32%),
    linear-gradient(140deg,#07162f,#0a1e3c 50%,#06152d);
}
.stage::after{
  content:"";position:absolute;inset:0;z-index:-1;opacity:.13;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.28) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(circle at 50% 46%,#000 0%,transparent 72%);
}
.stage-head{width:min(430px,100%);display:flex;align-items:flex-end;justify-content:space-between;color:#fff}
.stage-brand{display:flex;align-items:center;gap:8px}
.stage-brand__mark{width:26px;height:26px;border:1px solid rgba(255,255,255,.26);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.stage-brand__mark img{width:16px;height:16px;object-fit:contain}
.stage-brand__copy strong{display:block;font-size:13px;letter-spacing:.4px}
.stage-brand__copy em{display:block;font-style:normal;font-size:7px;letter-spacing:1.8px;color:rgba(255,255,255,.48);margin-top:2px}
.stage-note{font-size:9px;letter-spacing:1.2px;color:rgba(255,255,255,.55);text-transform:uppercase}
.stage-foot{width:min(430px,100%);display:flex;justify-content:space-between;color:rgba(255,255,255,.42);font-size:9px;letter-spacing:.6px}
.phone{
  position:relative;width:min(430px,100%);height:min(880px,calc(100vh - 126px));height:min(880px,calc(100dvh - 126px));
  overflow:hidden;border-radius:34px;background:var(--paper);
  border:1px solid rgba(255,255,255,.32);
  box-shadow:0 42px 90px rgba(0,0,0,.46),0 0 0 8px rgba(255,255,255,.035),inset 0 0 0 1px rgba(255,255,255,.25);
}
@media (max-width:520px){
  body{background:var(--paper)}
  .stage{padding:0;gap:0;display:block}
  .stage::before,.stage::after,.stage-head,.stage-foot{display:none}
  .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
}

/* ---------- app shell ---------- */
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);background:radial-gradient(circle at 8% -8%,rgba(31,75,216,.09),transparent 34%),var(--paper)}
.page{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:9px 0 calc(92px + env(safe-area-inset-bottom));scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.page-pad{padding:0 20px}

/* ---------- common ---------- */
.eyebrow{display:block;font-size:9px;line-height:1.3;font-weight:600;letter-spacing:2.35px;color:var(--muted);text-transform:uppercase}
.page-title{margin:3px 0 0;font-size:30px;line-height:1.06;font-weight:700;letter-spacing:-1.3px}
.section-title{margin:3px 0 0;font-size:19px;line-height:1.15;font-weight:700;letter-spacing:-.5px}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.dark-card{position:relative;overflow:hidden;border-radius:22px;background:var(--navy);color:#fff}
.soft-grid{position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:22px 22px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:#EEF4FF;color:#5F6B7E;font-size:9px;font-weight:600;line-height:1.3}
.pill--dark{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.74)}
.pill--success{background:rgba(14,159,110,.1);color:var(--green)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.muted{color:var(--muted)}
.btn{height:44px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:14px;font-size:13.5px;font-weight:600;border:0}
.btn--primary{background:var(--blue);color:#fff}
.btn--outline{background:#fff;border:1px solid #DCE5F2;color:var(--ink)}
.btn--ghost{background:#EEF4FF;color:var(--blue)}
.btn img{width:16px;height:16px;object-fit:contain}
.link{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:0;font-size:11px;color:var(--muted)}
.link img{width:12px;height:12px;object-fit:contain}
.chevron{width:13px;height:13px;object-fit:contain;flex:none}

/* ---------- headers ---------- */
.head{display:flex;align-items:center;justify-content:space-between;padding:7px 20px 5px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.brand-mark img{width:24px;height:24px;object-fit:contain}
.brand-name strong{display:block;font-size:18px;line-height:1.05;letter-spacing:-.5px}
.brand-name em{display:block;margin-top:3px;font-style:normal;font-family:"SFMono-Regular",Consolas,monospace;font-size:7px;letter-spacing:1.9px;color:var(--muted)}
.icon-btn{position:relative;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.icon-btn img{width:19px;height:19px;object-fit:contain}
.icon-btn--blue{background:var(--blue);border-color:var(--blue)}
.icon-btn--blue img{width:17px;height:17px;filter:brightness(0) invert(1)}
.head-badge{position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #fff}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;padding:9px 20px 13px;gap:10px}
.page-head__side{width:38px;flex:none;display:flex;align-items:center}
.page-head__side--right{justify-content:flex-end}
.catalog-total{font-size:10px;color:var(--muted);letter-spacing:1px}
.catalog-heading{text-align:center;flex:1}
.catalog-heading .page-title{font-size:26px}

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  height:calc(64px + env(safe-area-inset-bottom));
  padding:5px 7px env(safe-area-inset-bottom);
  display:flex;align-items:stretch;
  background:rgba(255,255,255,.94);border-top:1px solid #E7EDF6;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#8390A4;font-size:9.5px;position:relative;border-radius:10px}
.nav-item.active{color:var(--ink);font-weight:600}
.nav-item.active::after{content:"";position:absolute;bottom:2px;width:4px;height:2px;border-radius:2px;background:var(--blue);opacity:.9}
.nav-icon{width:24px;height:24px;object-fit:contain}
.nav-badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:13px;height:13px;padding:0 3px;border-radius:999px;background:var(--blue);color:#fff;font-size:7.5px;line-height:13px;text-align:center;font-weight:700}

/* ---------- onboarding ---------- */
.ob{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 9% -8%,rgba(31,75,216,.1),transparent 34%),var(--paper)}
.ob-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px}
.ob-skip{font-size:11px;color:var(--muted);padding:5px 0}
.ob-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px 10px;scrollbar-width:none;display:flex;flex-direction:column}
.ob-body::-webkit-scrollbar{display:none}
.ob-hero{position:relative;flex:1;height:auto;min-height:455px;overflow:hidden;border-radius:26px;background:#0B1D3D;color:#fff}
.ob-hero img.ob-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ob-hero-mask{position:absolute;inset:0;background:linear-gradient(165deg,rgba(7,20,43,.26) 0%,rgba(7,20,43,.55) 44%,rgba(7,20,43,.95) 100%)}
.ob-hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:20px 18px 22px}
.ob-brand{display:flex;align-items:center;gap:10px}
.ob-logo-white{width:46px;height:46px;object-fit:contain}
.ob-brand-cn{display:block;font-size:19px;line-height:1.05;font-weight:700}
.ob-brand-en{display:block;margin-top:4px;font-family:"SFMono-Regular",Consolas,monospace;font-size:7px;letter-spacing:2px;color:rgba(255,255,255,.54)}
.ob-index{display:block;font-family:"SFMono-Regular",Consolas,monospace;font-size:8px;letter-spacing:2.2px;color:rgba(255,255,255,.5)}
.ob-hero-title{margin-top:8px;font-size:35px;line-height:1.12;font-weight:700;letter-spacing:-1.4px}
.ob-line{display:block}
.ob-hero-desc{display:block;margin-top:11px;max-width:290px;font-size:11px;line-height:1.7;color:rgba(255,255,255,.69)}
.ob-rule{display:flex;align-items:center;gap:8px;margin-top:18px;font-family:"SFMono-Regular",Consolas,monospace;font-size:7.5px;letter-spacing:1.3px;color:rgba(255,255,255,.5)}
.ob-rule-line{width:26px;height:1px;background:rgba(255,255,255,.32)}
.ob-card{flex:none;background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-top:auto;margin-bottom:auto}
.ob-brand--dark{color:var(--ink)}
.ob-logo-dark{width:44px;height:44px;object-fit:contain}
.ob-brand--dark .ob-brand-en{color:var(--muted)}
.ob-index--dark{margin-top:15px;color:var(--muted)}
.ob-card-title{margin-top:5px;font-size:29px;line-height:1.12;font-weight:700;letter-spacing:-1.2px}
.ob-card-desc{display:block;margin-top:10px;font-size:11px;line-height:1.68;color:var(--muted)}
.ob-steps,.ob-scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}
.ob-step,.ob-scene{background:#F4F8FF;border:1px solid #EDF2FA;border-radius:14px;padding:10px 7px 9px;text-align:center;min-width:0}
.ob-step-icon,.ob-scene-icon{width:32px;height:32px;margin:0 auto 7px;border-radius:50%;background:#fff;border:1px solid #E4EBF4;display:grid;place-items:center;font-size:16px;color:var(--blue);font-weight:700}
.ob-step-title,.ob-scene-title{display:block;font-size:10.5px;font-weight:700;line-height:1.3}
.ob-step-desc,.ob-scene-desc{display:block;margin-top:3px;font-size:8.5px;line-height:1.55;color:var(--muted)}
.ob-ready{margin-top:16px;padding:12px 13px;border:1px solid #DDE8FA;border-radius:14px;background:linear-gradient(135deg,#F8FBFF,#EEF4FF)}
.ob-ready-title{display:block;font-size:11px;font-weight:700;color:var(--blue);line-height:1.4}
.ob-ready-desc{display:block;margin-top:4px;font-size:9.5px;line-height:1.55;color:#60708A}
.ob-ready--line{margin-top:14px;padding:0;border:0;background:none}
.ob-ready--line .ob-ready-title{color:var(--green);font-weight:600;font-size:10px}
.ob-footer{flex:none;padding:10px 17px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,248,255,0),#F4F8FF 24%)}
.ob-dots{display:flex;justify-content:center;gap:5px;margin-bottom:10px}
.ob-dot{width:5px;height:5px;border-radius:50%;background:#C8D3E2;transition:.2s}
.ob-dot--active{width:17px;border-radius:999px;background:var(--blue)}
.ob-action{display:flex;align-items:center;justify-content:space-between;gap:14px}
.ob-action--single .ob-button{max-width:none;width:100%}
.ob-secondary{font-size:10.5px;color:var(--muted);white-space:nowrap;padding:8px 0}
.ob-button{height:46px;flex:1;max-width:230px;border-radius:15px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;box-shadow:0 8px 22px rgba(31,75,216,.24)}
.ob-arrow{font-size:17px;line-height:1}

/* ---------- home ---------- */
.home-tabs{display:flex;gap:22px;overflow-x:auto;padding:0 20px;border-bottom:1px solid #E7EDF6;scrollbar-width:none}
.home-tabs::-webkit-scrollbar{display:none}
.home-tab{position:relative;flex:none;padding:10px 0 12px;font-size:12.5px;color:#8390A4;white-space:nowrap}
.home-tab--active{color:var(--ink);font-weight:600}
.home-tab--active::after{content:"";position:absolute;left:50%;bottom:-1px;width:20px;height:2px;border-radius:2px;background:var(--blue);transform:translateX(-50%)}
.hero{position:relative;height:232px;overflow:hidden;border-radius:22px;background:var(--blue);margin-top:12px}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(103deg,#0B1D3D 0%,#123B96 42%,rgba(31,75,216,.38) 70%,rgba(31,75,216,0) 100%)}
.hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hero-kicker{display:flex;align-items:center;gap:4px;padding:5px 9px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.08);font-size:8.5px;line-height:1.3}
.hero-dot{width:5px;height:5px;border-radius:50%;background:var(--sky);flex:none}
.hero-online{font-family:"SFMono-Regular",Consolas,monospace;font-size:8px;letter-spacing:.8px;color:rgba(255,255,255,.62);white-space:nowrap;padding-top:2px}
.hero-main{display:flex;flex-direction:column;align-items:flex-start}
.hero-title{font-size:29px;line-height:1.1;font-weight:700;letter-spacing:-1.2px;text-shadow:0 2px 14px rgba(0,0,0,.15)}
.hero-title span{display:block}
.hero-sub{display:block;margin-top:7px;font-size:11px;color:rgba(255,255,255,.74)}
.hero-button{display:inline-flex;align-items:center;gap:5px;height:33px;margin-top:11px;padding:0 13px;border-radius:999px;background:#fff;color:var(--blue);font-size:10.5px;font-weight:700;border:0}
.hero-arrow{font-size:15px;line-height:1}
.section{margin-top:22px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:9px}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.product-card{display:block;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 5px 17px rgba(22,36,61,.04);text-align:left;padding:0}
.product-media{display:block;position:relative;height:116px;background:radial-gradient(circle at 50% 25%,#FBFDFF,#EEF4FF 68%)}
.product-image{width:100%;height:100%;object-fit:contain;padding:6px}
.product-flag{position:absolute;left:7px;top:7px;display:flex;align-items:center;gap:3px;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--muted);font-size:8.5px;font-weight:500;line-height:1.2}
.product-flag--online{color:var(--green)}
.product-flag--offline{color:var(--muted-2)}
.product-flag__dot{width:4px;height:4px;border-radius:50%;background:currentColor}
.product-info{display:block;padding:8px 8px 9px}
.product-name{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:12px;line-height:1.36;font-weight:600;letter-spacing:-.2px;min-height:32px}
.product-meta{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;color:var(--muted)}
.happen-list{padding:0 14px}
.happen-item{display:flex;align-items:center;gap:9px;padding:12px 0;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #EDF1F7}
.happen-item:last-child{border-bottom:0}
.happen-icon{width:38px;height:38px;border-radius:13px;background:#EEF4FF;color:var(--blue);display:grid;place-items:center;font-size:18px;flex:none}
.happen-copy{flex:1;min-width:0}
.happen-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.happen-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.happen-live{display:flex;align-items:center;gap:3px;font-size:8.5px;color:var(--green);white-space:nowrap}
.happen-sub{display:block;margin-top:3px;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-story{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:18px;padding:17px;border-radius:18px;background:#0B1D3D;color:#fff;overflow:hidden;width:100%;text-align:left;border:0}
.home-story::before{content:"";position:absolute;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);background-size:24px 24px}
.home-story__kicker{position:relative;z-index:1;display:block;font-family:"SFMono-Regular",Consolas,monospace;font-size:7.5px;letter-spacing:1.5px;color:rgba(255,255,255,.48)}
.home-story__title{position:relative;z-index:1;display:block;margin-top:6px;font-size:15px;line-height:1.45;font-weight:600;letter-spacing:-.4px;max-width:270px}
.home-story__mark{position:relative;z-index:1;font-size:29px;color:#79A8FF;line-height:1}
.demo-stamp{margin:18px 0 2px;text-align:center;font-family:"SFMono-Regular",Consolas,monospace;font-size:7px;letter-spacing:1.6px;color:#A6B3C6}

/* story tab */
.story-hero{position:relative;height:360px;overflow:hidden;border-radius:22px;background:#0B1D3D;color:#fff;margin-top:12px}
.story-hero__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story-hero__mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,20,43,.26),rgba(7,20,43,.94))}
.story-hero__copy{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.story-eyebrow{color:rgba(255,255,255,.54)}
.story-title{margin-top:8px;font-size:22px;line-height:1.4;font-weight:700;letter-spacing:-.8px}
.story-title span{display:block}
.story-desc{display:block;margin-top:10px;font-size:10.5px;line-height:1.7;color:rgba(255,255,255,.68)}
.story-value{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-bottom:8px}
.story-value__index{font-family:"SFMono-Regular",Consolas,monospace;font-size:20px;line-height:1;color:var(--blue);font-weight:700;letter-spacing:-1px}
.story-value__title{display:block;font-size:13.5px;font-weight:700}
.story-value__desc{display:block;margin-top:4px;font-size:10px;line-height:1.6;color:var(--muted)}
.story-cta{margin-top:4px;width:100%}
.catalog-head-copy{padding:13px 0 2px}
.catalog-title-big{margin:5px 0 0;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-1.1px}
.catalog-desc{display:block;margin-top:7px;font-size:10.5px;line-height:1.65;color:var(--muted)}
.solution-card{position:relative;display:block;width:100%;height:196px;margin-top:10px;overflow:hidden;border-radius:20px;background:#0B1D3D;color:#fff;text-align:left;border:0}
.solution-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.solution-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,20,43,.15),rgba(7,20,43,.9))}
.solution-copy{position:absolute;inset:auto 0 0 0;z-index:2;padding:16px}
.solution-title{display:block;font-size:19px;font-weight:700;letter-spacing:-.7px}
.solution-desc{display:block;margin-top:4px;font-size:10px;line-height:1.55;color:rgba(255,255,255,.7);max-width:260px}
.solution-link{display:block;margin-top:8px;font-size:9.5px;color:#9CC0FF}
.solutions-note{margin-top:18px;padding:14px;border-radius:16px;background:#EEF4FF}
.solutions-note__text{display:block;margin-top:5px;font-size:10.5px;line-height:1.65;color:#5F6B7E}

/* ---------- devices ---------- */
.family-card{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:22px;padding:17px;min-height:198px;display:flex;flex-direction:column;justify-content:space-between}
.family-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.family-kicker{font-family:"SFMono-Regular",Consolas,monospace;font-size:7.5px;letter-spacing:1.7px;color:rgba(255,255,255,.48)}
.family-live{display:flex;align-items:center;gap:4px;font-size:8.5px;color:#8DE0C0}
.family-name{position:relative;z-index:1;display:block;margin-top:10px;font-size:26px;font-weight:700;letter-spacing:-1px}
.family-online{position:relative;z-index:1;display:flex;align-items:baseline;gap:5px;margin-top:5px}
.family-online__number{font-size:24px;font-weight:700;letter-spacing:-.8px}
.family-online__unit{font-size:9.5px;color:rgba(255,255,255,.55)}
.family-stats{position:relative;z-index:1;display:flex;gap:32px;margin-top:14px}
.family-stat__number{display:block;font-size:19px;font-weight:700;line-height:1}
.family-stat__percent{font-size:11px;font-weight:600}
.family-stat__label{display:block;margin-top:4px;font-size:8px;color:rgba(255,255,255,.48)}
.devices-count{font-family:"SFMono-Regular",Consolas,monospace;font-size:8px;letter-spacing:1.2px;color:var(--muted);white-space:nowrap}
.device-list{display:flex;flex-direction:column;gap:8px}
.device-card{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);text-align:left;width:100%}
.device-thumb{position:relative;width:58px;height:58px;border-radius:14px;background:radial-gradient(circle at 50% 25%,#FBFDFF,#EEF4FF 70%);flex:none}
.device-thumb__img{width:100%;height:100%;object-fit:contain;padding:4px}
.device-state-dot{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.device-state-dot--on{background:var(--green)}
.device-state-dot--off{background:#A7B2C3}
.device-card__copy{flex:1;min-width:0}
.device-card__top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.device-room{font-size:9px;color:var(--muted);letter-spacing:.3px}
.device-status{display:flex;align-items:center;gap:3px;font-size:8.5px;color:var(--green);white-space:nowrap}
.device-status--off{color:var(--muted-2)}
.device-name{display:block;margin-top:3px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.device-meta{display:flex;align-items:center;gap:9px;margin-top:4px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden}
.device-meta__item{display:flex;align-items:center;gap:2px;overflow:hidden;text-overflow:ellipsis}
.devices-note{margin-top:20px;padding:14px;border-radius:16px;background:#EEF4FF}
.devices-note__title{display:block;margin-top:5px;font-size:12px;line-height:1.5;font-weight:600;color:#384861}

/* ---------- scenes ---------- */
.scene-hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:22px;padding:17px;min-height:202px}
.scene-hero__top{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.scene-hero__kicker{font-family:"SFMono-Regular",Consolas,monospace;font-size:7.5px;letter-spacing:1.5px;color:rgba(255,255,255,.48)}
.scene-hero__title{position:relative;z-index:1;margin-top:16px;font-size:27px;line-height:1.12;font-weight:700;letter-spacing:-1px}
.scene-hero__line{display:block}
.scene-hero__desc{position:relative;z-index:1;display:block;margin-top:10px;font-size:10px;line-height:1.65;color:rgba(255,255,255,.6);max-width:300px}
.scene-count{font-family:"SFMono-Regular",Consolas,monospace;font-size:8px;color:var(--muted);white-space:nowrap}
.scene-card{padding:12px;margin-bottom:9px}
.scene-top{display:flex;align-items:flex-start;gap:10px}
.scene-thumb{position:relative;width:76px;height:86px;border-radius:14px;overflow:hidden;background:#EEF4FF;flex:none}
.scene-thumb--plain{background:linear-gradient(145deg,#123B96,#0B1D3D)}
.scene-thumb__img{width:100%;height:100%;object-fit:cover}
.scene-thumb__glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:25px;color:#fff}
.scene-thumb__tag{position:absolute;left:6px;top:6px;width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.9);color:var(--blue);font-size:10px}
.scene-copy{flex:1;min-width:0;padding-top:2px}
.scene-name{display:block;font-size:14px;font-weight:700;letter-spacing:-.3px}
.scene-sub{display:block;margin-top:3px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene-meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:8px}
.scene-meta__item{font-size:8.5px;color:var(--muted-2);line-height:1.4}
.switch{position:relative;width:38px;height:22px;border-radius:999px;background:#DDE5F2;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:.2s}
.switch.on{background:var(--blue)}
.switch.on::after{left:18px}
.scene-divider{height:1px;background:#EDF1F7;margin:11px 0 10px}
.scene-desc{display:block;font-size:9.5px;line-height:1.65;color:#5F6B7E}
.scene-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.scene-last{font-size:8.5px;color:var(--muted)}
.scene-run{display:inline-flex;align-items:center;gap:3px;height:26px;padding:0 8px;border-radius:999px;background:var(--blue);color:#fff;font-size:8.5px;font-weight:600;border:0}
.scene-run img{width:9px;height:9px;object-fit:contain}

/* ---------- messages ---------- */
.mark-all{font-size:10px;color:var(--blue);font-weight:600;white-space:nowrap}
.inbox-hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:22px;padding:17px;min-height:192px}
.inbox-top{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.inbox-kicker{font-family:"SFMono-Regular",Consolas,monospace;font-size:7.5px;letter-spacing:1.5px;color:rgba(255,255,255,.48)}
.inbox-number{position:relative;z-index:1;display:block;margin-top:24px;font-size:46px;line-height:.9;font-weight:700;letter-spacing:-2px}
.inbox-desc{position:relative;z-index:1;display:block;margin-top:10px;font-size:9.5px;line-height:1.65;color:rgba(255,255,255,.56);max-width:290px}
.filter-row{display:flex;gap:6px;overflow-x:auto;margin:14px 0 11px;padding-bottom:1px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-pill{flex:none;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:9.5px;color:var(--muted)}
.filter-pill--active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.notice-list{display:flex;flex-direction:column;gap:8px}
.notice-card{display:flex;gap:10px;padding:12px;text-align:left;width:100%}
.notice-card--read{opacity:.7}
.notice-icon{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;font-size:15px;flex:none}
.notice-icon--device{background:#EEF4FF;color:var(--blue)}
.notice-icon--scene{background:#EDF9F4;color:var(--green)}
.notice-icon--system{background:#FFF7E6;color:var(--warn)}
.notice-copy{flex:1;min-width:0}
.notice-top{display:flex;align-items:center;gap:5px}
.notice-type{font-size:8.5px;font-weight:600;color:var(--blue);letter-spacing:.4px}
.notice-time{margin-left:auto;font-size:8px;color:var(--muted)}
.notice-unread{width:5px;height:5px;border-radius:50%;background:var(--blue);flex:none}
.notice-title{display:block;margin-top:4px;font-size:12px;font-weight:700;line-height:1.35}
.notice-body{display:block;margin-top:3px;font-size:9.5px;line-height:1.55;color:var(--muted)}
.notice-foot{display:flex;align-items:center;gap:2px;margin-top:6px;font-size:8.5px;color:var(--blue)}
.notice-foot img{width:9px;height:9px}
.inbox-note{display:flex;align-items:flex-start;gap:5px;margin-top:16px;padding:0 2px;font-size:8.5px;line-height:1.6;color:var(--muted)}
.inbox-note .dot{margin-top:6px;color:var(--hint,#A7B2C3)}
.empty-state{padding:32px 18px;text-align:center;color:var(--muted);font-size:11px;border-radius:16px;background:#fff;border:1px solid var(--line)}

/* ---------- profile ---------- */
.profile-hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:22px;padding:17px;min-height:218px}
.profile-top{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.profile-logo{width:58px;height:58px;object-fit:contain}
.profile-hello{position:relative;z-index:1;display:block;margin-top:16px;font-size:24px;font-weight:700;letter-spacing:-1px;line-height:1.2}
.profile-home{position:relative;z-index:1;display:block;margin-top:4px;font-size:10px;color:rgba(255,255,255,.56)}
.profile-stats{position:relative;z-index:1;display:flex;gap:30px;margin-top:17px}
.profile-stat__num{display:block;font-size:19px;line-height:1;font-weight:700}
.profile-stat__label{display:block;margin-top:4px;font-size:8px;color:rgba(255,255,255,.48)}
.shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shortcut{padding:12px;text-align:left;border-radius:16px}
.shortcut-icon{width:32px;height:32px;border-radius:10px;background:#EEF4FF;color:var(--blue);display:grid;place-items:center;font-size:16px;margin-bottom:7px}
.shortcut-name{display:block;font-size:12.5px;font-weight:600}
.shortcut-desc{display:block;margin-top:3px;font-size:9px;color:var(--muted)}
.settings{padding:0 14px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 0;border-bottom:1px solid #EDF1F7;text-align:left}
.setting-row:last-child{border-bottom:0}
.setting-copy{flex:1;min-width:0}
.setting-name{display:block;font-size:12px;font-weight:600}
.setting-desc{display:block;margin-top:3px;font-size:9px;color:var(--muted);line-height:1.45}
.profile-footer{display:flex;flex-direction:column;align-items:center;padding:24px 0 8px;text-align:center}
.footer-logo{width:55px;height:30px;object-fit:contain;opacity:.55}
.footer-copy{display:block;margin-top:7px;font-family:"SFMono-Regular",Consolas,monospace;font-size:7px;letter-spacing:1.2px;color:var(--muted)}
.footer-note{display:block;margin-top:4px;font-size:8px;line-height:1.5;color:#9AA6B7}

/* ---------- catalog ---------- */
.catalog-hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:22px;padding:17px;min-height:205px}
.catalog-kicker{position:relative;z-index:1;font-family:"SFMono-Regular",Consolas,monospace;font-size:7.5px;letter-spacing:1.5px;color:rgba(255,255,255,.46)}
.catalog-hero-title{position:relative;z-index:1;margin-top:15px;font-size:24px;line-height:1.22;font-weight:700;letter-spacing:-.9px}
.catalog-line{display:block}
.catalog-hero-desc{position:relative;z-index:1;display:block;margin-top:9px;font-size:9.5px;line-height:1.65;color:rgba(255,255,255,.58);max-width:300px}
.search-box{display:flex;align-items:center;gap:7px;height:40px;margin-top:12px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.search-glyph{font-size:16px;color:var(--muted);flex:none}
.search-input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:11px;color:var(--ink);padding:0}
.search-input::placeholder{color:#A6B2C4}
.search-clear{font-size:15px;color:var(--muted);display:none;padding:4px;line-height:1}
.filter-scroll{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:1px;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.catalog-chip{flex:none;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:9.5px}
.catalog-chip--active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.catalog-count{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px;font-size:9px;color:var(--muted)}
.catalog-count__hint{color:#A6B2C4}
.catalog-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catalog-card{display:block;overflow:hidden;text-align:left;padding:0;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.catalog-media{display:block;position:relative;height:112px;background:radial-gradient(circle at 50% 25%,#FBFDFF,#EEF4FF 68%)}
.catalog-media img{width:100%;height:100%;object-fit:contain;padding:7px}
.tier{position:absolute;left:7px;top:7px;padding:3px 6px;border-radius:999px;font-size:8px;font-weight:600;line-height:1.2;background:#EEF4FF;color:var(--blue)}
.tier--flagship{background:#0B1D3D;color:#fff}
.tier--main{background:#EEF4FF;color:var(--blue)}
.tier--entry{background:#F2F5FA;color:#7C879A}
.product-id{position:absolute;right:7px;top:8px;font-family:"SFMono-Regular",Consolas,monospace;font-size:7px;letter-spacing:.6px;color:#A6B2C4}
.catalog-copy{display:block;padding:8px}
.product-scene{display:block;font-size:8px;letter-spacing:.8px;color:var(--muted)}
.catalog-copy .product-name{margin-top:2px;min-height:33px;font-size:12px}
.product-oneliner{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;margin-top:4px;font-size:9px;line-height:1.45;color:var(--muted);min-height:26px}
.product-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.product-tag{padding:2px 4px;border-radius:4px;background:#F2F5FA;color:#7C879A;font-size:7.5px;line-height:1.35}
.product-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.product-price{font-size:11px;font-weight:700;color:var(--ink)}
.product-arrow{width:12px;height:12px;object-fit:contain}
.catalog-note{margin-top:16px;padding:13px;border-radius:15px;background:#EEF4FF}
.catalog-note__title{display:block;font-size:10.5px;font-weight:700;color:#384861}
.catalog-note__body{display:block;margin-top:4px;font-size:9px;line-height:1.6;color:#66758D}

/* ---------- device detail ---------- */
.device-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 20px 12px}
.device-back{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.device-back img{width:15px;height:15px;object-fit:contain}
.device-head__title{text-align:center;flex:1;min-width:0}
.device-head__title .eyebrow{font-size:8px}
.device-title{display:block;margin-top:2px;font-size:19px;font-weight:700;letter-spacing:-.6px}
.device-hero{padding:15px;border-radius:22px}
.device-hero__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.device-room-pill{padding:4px 9px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:9px;font-weight:600}
.device-live{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--green)}
.device-live--off{color:var(--muted-2)}
.device-hero__name{display:block;margin-top:11px;font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.8px}
.device-hero__meta{display:flex;align-items:center;gap:12px;margin-top:6px}
.device-meta-live{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--green)}
.device-meta-live--off{color:var(--muted-2)}
.device-battery-line{font-size:9px;color:var(--muted)}
.device-visual{position:relative;height:222px;margin-top:12px;border-radius:18px;overflow:hidden;background:linear-gradient(150deg,#123B96,#0B1D3D 70%);display:grid;place-items:center}
.device-grid{opacity:.2}
.device-halo{position:relative;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(90,160,255,.32),rgba(90,160,255,.04) 62%,transparent 70%);border:1px solid rgba(255,255,255,.17)}
.device-halo::before{content:"";position:absolute;inset:16px;border-radius:50%;border:1px dashed rgba(255,255,255,.18)}
.device-sweep{position:absolute;width:145px;height:145px;border-radius:50%;background:conic-gradient(from 0deg,rgba(93,172,255,.28),transparent 32%);animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.device-product{position:relative;z-index:2;width:138px;height:138px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.24))}
.device-range{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.66);font-size:8px}
.device-charging-pill{position:absolute;right:10px;top:10px;padding:4px 8px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:8px;font-weight:600}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.metric{display:flex;align-items:center;gap:9px;padding:10px;border-radius:15px}
.metric-icon{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.metric-icon--blue{background:#EEF4FF;color:var(--blue)}
.metric-icon--sky{background:#EAF8FC;color:#1586A9}
.metric-icon--green{background:#EDF9F4;color:var(--green)}
.metric-icon img{width:16px;height:16px;object-fit:contain}
.metric-label{display:block;font-size:8px;color:var(--muted);line-height:1.2}
.metric-value{display:block;margin-top:2px;font-size:11.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.control-card{margin-top:10px;padding:14px}
.control-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.control-title{display:block;margin-top:3px;font-size:17px;font-weight:700;letter-spacing:-.5px}
.control-ready{padding:4px 8px;border-radius:999px;background:#EDF9F4;color:var(--green);font-size:8px;font-weight:600;white-space:nowrap}
.control-ready--off{background:#F2F5FA;color:var(--muted)}
.control-main{display:flex;align-items:center;gap:18px;margin-top:14px}
.dpad{position:relative;width:152px;height:152px;border-radius:50%;background:radial-gradient(circle,#F7FAFF,#EEF4FF);border:1px solid #E1EAF7;flex:none}
.dpad-ring{position:absolute;inset:25px;border-radius:50%;border:1px dashed #CBD8EA}
.dpad-button{position:absolute;width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid #E0E9F5;box-shadow:0 3px 8px rgba(22,36,61,.06);display:grid;place-items:center}
.dpad-button img{width:14px;height:14px;object-fit:contain}
.dpad-button--up{left:57px;top:5px}.dpad-button--down{left:57px;bottom:5px}.dpad-button--left{left:5px;top:57px}.dpad-button--right{right:5px;top:57px}
.dpad-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:45px;height:45px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--blue)}
.dpad-center__glyph{font-size:16px;line-height:1}
.dpad-center__text{font-size:7px;color:var(--muted)}
.control-actions{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.control-action{width:100%;font-size:11px;height:42px;border-radius:13px}
.last-command{margin-top:10px;font-size:8.5px;color:var(--muted)}
.offline-panel{display:flex;align-items:center;gap:10px;margin-top:13px;padding:12px;border-radius:14px;background:#F4F8FF;border:1px solid #E8EFF9}
.offline-icon{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:18px;color:var(--muted);flex:none}
.offline-copy{flex:1;min-width:0}
.offline-title{display:block;font-size:11px;font-weight:700}
.offline-desc{display:block;margin-top:2px;font-size:9px;color:var(--muted);line-height:1.45}
.offline-button{height:30px;padding:0 9px;border-radius:9px;background:var(--blue);color:#fff;font-size:9px;font-weight:600;white-space:nowrap;border:0}
.mode-card{margin-top:10px;padding:14px}
.mode-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mode-title{font-size:14px;font-weight:700}
.mode-count{font-size:8.5px;color:var(--muted)}
.mode-tabs{display:flex;gap:5px;margin-top:10px}
.mode-tab{flex:1;min-width:0;padding:8px 4px;border-radius:9px;background:#F4F8FF;border:1px solid #E8EFF9;font-size:8.5px;color:#5F6B7E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-tab--active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.mode-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:8px;color:var(--muted)}
.mode-version{font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:.6px}
.battery-track{height:5px;margin-top:7px;border-radius:999px;background:#EEF2F8;overflow:hidden}
.battery-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#1F4BD8,#4E8BFF)}
.device-footnote{display:flex;align-items:center;gap:5px;margin-top:13px;font-size:8.5px;color:var(--muted)}

/* ---------- modal / toast ---------- */
.modal-mask{position:fixed;inset:0;z-index:85;display:flex;align-items:flex-end;justify-content:center;padding:0;background:rgba(5,15,31,.55);backdrop-filter:blur(4px);animation:fade .18s ease}
.modal-sheet{width:min(430px,100%);max-height:82vh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px;animation:sheet .24s cubic-bezier(.2,.9,.3,1);scrollbar-width:none}
.modal-sheet::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(20px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.modal-title{font-size:18px;font-weight:700;letter-spacing:-.6px}
.modal-kicker{display:block;font-size:8px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase}
.modal-close{width:30px;height:30px;border-radius:50%;background:#F2F5FA;color:var(--muted);font-size:17px;line-height:1;display:grid;place-items:center;flex:none}
.modal-body{margin-top:12px;font-size:11px;line-height:1.7;color:#53617A}
.modal-product{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:#F4F8FF}
.modal-product img{width:88px;height:88px;object-fit:contain;flex:none}
.modal-product__name{font-size:15px;font-weight:700;line-height:1.3}
.modal-product__meta{display:block;margin-top:4px;font-size:9px;color:var(--muted)}
.modal-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.modal-actions{display:flex;gap:8px;margin-top:15px}
.modal-actions .btn{flex:1;height:42px;font-size:12px}
.page-index{display:grid;gap:6px;margin-top:12px}
.page-index__link{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;background:#F4F8FF;border:1px solid #E8EFF9;font-size:11px;font-weight:600}
.page-index__link span{font-size:8.5px;font-weight:400;color:var(--muted)}
.modal-footer{padding-bottom:calc(4px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:calc(105px + env(safe-area-inset-bottom));z-index:95;transform:translate(-50%,10px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:999px;background:rgba(11,29,61,.92);color:#fff;font-size:10.5px;line-height:1.3;white-space:nowrap;transition:.2s;backdrop-filter:blur(8px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

  function parseHash(){
    var raw = (location.hash || '').replace(/^#\/?/, '');

    var pieces = raw.split('?');
    var pathParts = pieces[0].split('/').filter(Boolean);
    return { page:pathParts[0] || '', id:pathParts[1] || '', query:new URLSearchParams(pieces[1] || '') };
  }

  /* ---------- catalog ---------- */
  function filterProducts(){
    var keyword = ui.catalogKeyword.trim().toLowerCase();
    return PRODUCTS.filter(function(product){
      var categoryMatch = ui.catalogFilter === 'all' || product.scene === ui.catalogFilter;
      if(!categoryMatch) return false;
      if(!keyword) return true;
      return [product.name, product.short, product.oneliner, product.scene].concat(product.tags).join(' ').toLowerCase().indexOf(keyword) > -1;
    });
  }
  function catalogGridHtml(){
    var products = filterProducts();
    if(products.length === 0){
      return '<div class="empty-state" style="grid-column:1/-1"><div style="font-size:26px;margin-bottom:6px">◌</div><div style="font-weight:600;color:#16243D">没有匹配的产品</div><div style="margin-top:4px">换一个关键词，或切回“全部”。</div></div>';

  /* ---------- render ---------- */
  function render(force){
    var route = parseHash();
    var page = route.page || 'home';
    var key = page + '/' + (route.id || '') + '?' + route.query.toString();
    var same = key === lastKey && !force;
    var oldScroll = 0;
    if(same){
      var scroller = document.querySelector('.scroll');
      if(scroller) oldScroll = scroller.scrollTop;
    }
    if(page === 'onboarding'){
      document.getElementById('app').innerHTML = renderOnboarding();
    } else {
      var content = '';
      var active = 'home';
      if(page === 'home'){
        var tabParam = route.query.get('tab');
        var allowedTabs = ['home','story','products','solutions'];
        ui.homeTab = allowedTabs.indexOf(tabParam) > -1 ? tabParam : 'home';
        content = renderHome(); active = 'home';
      } else if(page === 'devices'){
        content = renderDevices(); active = 'devices';
      } else if(page === 'device'){
        content = renderDevice(route.id); active = 'devices';
      } else if(page === 'scenes'){
        content = renderScenes(); active = 'scenes';
      } else if(page === 'messages'){
        content = renderMessages(); active = 'messages';
      } else if(page === 'profile'){
        content = renderProfile(); active = 'profile';
      } else if(page === 'catalog'){
        if(route.query.get('scene')) ui.catalogFilter = route.query.get('scene');
        if(route.query.get('focus')){
          var focused = getProduct(route.query.get('focus'));
          ui.catalogFilter = 'all';
          ui.catalogKeyword = focused.name;
        }
        content = renderCatalog(); active = 'home';
      } else {
        content = renderHome(); active = 'home';
      }
      document.getElementById('app').innerHTML = '<div class="page"><div class="scroll">' + content + '</div>' + bottomNav(active) + '</div>';
      if(same && oldScroll){
        requestAnimationFrame(function(){ var s = document.querySelector('.scroll'); if(s) s.scrollTop = oldScroll; });
      } else {
        requestAnimationFrame(function(){ var s = document.querySelector('.scroll'); if(s) s.scrollTop = 0; });
      }
    }
    lastKey = key;
    if(modalOpen) closeModal();
  }

  /* ---------- actions ---------- */
  function goHome(tab){
    if(tab) ui.homeTab = tab;
    navigate('home' + (tab ? '?tab=' + tab : ''));
  }
  function finishOnboarding(){
    state.onboardingSeen = true;
    saveState();
    ui.onboardingStep = 0;
    navigate('home');
  }

  document.addEventListener('click', function(event){
    var target = event.target.closest('[data-action]');
    if(!target){
      var nav = event.target.closest('a[href^="#/"]');
      if(nav && modalOpen) closeModal();
      return;
    }
    var action = target.getAttribute('data-action');
    var id = target.getAttribute('data-id');
    if(action === 'modal-mask'){
      if(event.target === target) closeModal();
      return;
    }
    if(action === 'ob-next'){
      if(ui.onboardingStep < 2){ ui.onboardingStep += 1; render(true); }
      else finishOnboarding();
      return;
    }
    if(action === 'ob-skip'){ finishOnboarding(); return; }
    if(action === 'messages'){ navigate('messages'); return; }
    if(action === 'devices'){ navigate('devices'); return; }
    if(action === 'scenes'){ navigate('scenes'); return; }
    if(action === 'catalog'){ ui.catalogFilter = 'all'; ui.catalogKeyword = ''; navigate('catalog'); return; }
    if(action === 'product-open'){
      var device = getDeviceByProduct(id);
      if(device) navigate('device/' + device.id);
      else navigate('catalog?focus=' + encodeQuery(id));
      return;
    }
    if(action === 'home-tab'){
      var tab = target.getAttribute('data-tab');
      ui.homeTab = tab;
      if(location.hash.indexOf('#/home') === 0){
        location.hash = '#/home?tab=' + tab;
      } else {
        navigate('home?tab=' + tab);
      }
      return;
    }
    if(action === 'solution'){
      navigate('catalog?scene=' + encodeQuery(target.getAttribute('data-scene')));
      return;
    }
    if(action === 'open-device'){ navigate('device/' + id); return; }
    if(action === 'device-toggle'){
      var d = getDevice(id);
      if(d){
        if(!d.online){ d.online = true; d.status = 'idle'; toast('设备已重新连接'); }
        else if(d.status === 'working'){ d.status = 'idle'; d.progress = 0; toast('任务已暂停'); }
        else { d.status = 'working'; d.progress = 36; toast('任务已启动'); }
        d.lastActive = '刚刚';
        saveState(); render(true);
      }
      return;
    }
    if(action === 'device-charge'){
      var dc = getDevice(id);
      if(dc){ dc.status = 'charging'; dc.lastActive = '刚刚'; saveState(); render(true); toast('已发送回充指令'); }
      return;
    }
    if(action === 'device-mode'){
      var dm = getDevice(id);
      if(dm){ dm.mode = target.getAttribute('data-mode'); dm.lastActive = '刚刚'; saveState(); render(true); toast('已切换至 ' + dm.mode); }
      return;
    }
    if(action === 'move'){ toast('已向' + target.getAttribute('data-dir') + '移动 30cm'); return; }
    if(action === 'toggle-scene'){
      var scene = state.scenes.filter(function(s){ return s.id === id; })[0];
      if(scene){ scene.enabled = !scene.enabled; saveState(); render(true); toast(scene.enabled ? '场景已启用' : '场景已暂停'); }
      return;
    }
    if(action === 'run-scene'){
      var runScene = state.scenes.filter(function(s){ return s.id === id; })[0];
      if(runScene){
        runScene.lastRun = '刚刚';
        state.notifications.unshift({ id:'notice-' + Date.now(), title:runScene.name + '已执行', body:runScene.description, time:'刚刚', read:false, type:'scene', deviceId:runScene.deviceIds[0] || '' });
        saveState(); render(true); toast(runScene.name + ' 已开始执行');
      }
      return;
    }
    if(action === 'mark-all'){
      state.notifications.forEach(function(n){ n.read = true; });
      saveState(); render(true); toast('已全部标记为已读');
      return;
    }
    if(action === 'message-filter'){ ui.messagesFilter = target.getAttribute('data-key'); render(true); return; }
    if(action === 'open-notice'){
      var notice = state.notifications.filter(function(n){ return n.id === id; })[0];
      if(notice){
        notice.read = true; saveState();
        if(notice.deviceId) navigate('device/' + notice.deviceId);
        else { render(true); toast('消息已读'); }
      }
      return;
    }
    if(action === 'toggle-notifications'){ state.notificationsEnabled = !state.notificationsEnabled; saveState(); render(true); return; }
    if(action === 'restart-onboarding'){
      state.onboardingSeen = false; saveState(); ui.onboardingStep = 0; navigate('onboarding'); return;
    }
    if(action === 'about'){ aboutModal(); return; }
    if(action === 'reset-demo'){ resetModal(); return; }
    if(action === 'confirm-reset'){
      state = createInitialState();
      ui.homeTab = 'home'; ui.onboardingStep = 0; ui.catalogFilter = 'all'; ui.catalogKeyword = ''; ui.messagesFilter = 'all';
      saveState(); closeModal(); navigate('onboarding'); toast('演示数据已恢复');
      return;
    }
    if(action === 'page-index'){ pageIndexModal(); return; }
    if(action === 'modal-nav'){ closeModal(); navigate(target.getAttribute('data-nav')); return; }
    if(action === 'catalog-product'){ var p = getProduct(id); if(p) productModal(p); return; }
    if(action === 'close-modal'){ closeModal(); return; }
    if(action === 'modal-device'){ closeModal(); navigate('device/' + id); return; }
    if(action === 'modal-catalog'){ closeModal(); navigate('catalog?focus=' + encodeQuery(id)); return; }
    if(action === 'catalog-back'){ navigate('home'); return; }
    if(action === 'catalog-filter'){
      ui.catalogFilter = target.getAttribute('data-key');
      var chips = document.querySelectorAll('[data-action="catalog-filter"]');
      chips.forEach(function(chip){ chip.classList.toggle('catalog-chip--active', chip.getAttribute('data-key') === ui.catalogFilter); });
      updateCatalogGrid();
      return;
    }
    if(action === 'clear-search'){
      ui.catalogKeyword = '';
      var input = document.getElementById('catalog-search');
      if(input){ input.value = ''; input.focus(); }
      updateCatalogGrid();
      return;
    }
  });

  document.addEventListener('input', function(event){
    if(event.target && event.target.id === 'catalog-search'){
      ui.catalogKeyword = event.target.value;
      updateCatalogGrid();
    }
  });

  window.addEventListener('hashchange', function(){ render(false); });
  window.addEventListener('popstate', function(){ render(false); });

  // initial route
  if(!location.hash){
    location.hash = state.onboardingSeen ? '#/home' : '#/onboarding';
    render(true);
  } else {
    render(true);
  }
})();
</script>
</body>
</html>
